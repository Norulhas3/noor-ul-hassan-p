    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta property="og:type" content="website" />

    <!-- Structured data: tells Google "Noor ul Hassan" is a person and this site is theirs -->
    <script type="application/ld+json">

          "@type": "WebSite",
          "@id": "https://nuh-portfolio.site/#website",
          "url": "https://nuh-portfolio.site/",
          "name": "Noor ul Hassan",
          "alternateName": "Noor ul Hassan Portfolio",
          "inLanguage": "en",
          "publisher": { "@id": "https://nuh-portfolio.site/#person" }
        },
        {
          "@type": "Person",
          "@id": "https://nuh-portfolio.site/#person",
          "name": "Noor ul Hassan",
          "url": "https://nuh-portfolio.site/",
          "jobTitle": "Full Stack Developer",
          "description": "Full Stack Developer building fast, scalable applications with React, Node.js and modern web technologies.",
          "address": { "@type": "PostalAddress", "addressLocality": "Lahore", "addressCountry": "PK" },

        }
